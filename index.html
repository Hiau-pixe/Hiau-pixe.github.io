<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>南漫社 · 达人寄样系统</title>
<!-- 关键修复1：使用 UMD 通用版 SDK，彻底解决 import / 加载失败 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, '微软雅黑', sans-serif;
  }
  body {
    background: #f5f7fb;
    padding: 12px;
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .title-main {
    text-align: center;
    font-size: 22px;
    color: #d81e06;
    margin: 8px 0 12px;
  }
  .goods-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .goods-item {
    border-radius: 16px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #f0f0f0;
  }
  .add-btn {
    background: #d81e06;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 30px;
  }
  .cart-box {
    background: #fef6e0;
    border-radius: 20px;
    padding: 14px;
    margin: 12px 0;
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    margin-bottom: 10px;
  }
  .parse-btn, .submit-btn, .query-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    color: white;
    margin-bottom: 8px;
  }
  .parse-btn { background: #1677ff; }
  .submit-btn { background: #07c160; }
  .query-btn { background: #1677ff; }
  .order-result {
    background: #eef9f0;
    padding: 16px;
    border-radius: 16px;
    display: none;
  }
  .history-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .refresh-btn {
    padding: 6px 12px;
    background: #333;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 12px;
  }
</style>
</head>
<body>
<h1 class="title-main">🎁 南漫社达人寄样下单</h1>

<div class="card">
  <div style="font-weight:600; margin-bottom:10px;">
    商品列表
    <button class="refresh-btn" onclick="loadGoodsFromDB()" style="float:right">🔄 刷新</button>
  </div>
  <div id="goodsList" class="goods-grid">加载中...</div>
</div>

<div class="cart-box">
  <div style="font-weight:700">🛒 已选商品</div>
  <div id="cartList"></div>
</div>

<div class="card">
  <div style="font-weight:700; margin-bottom:10px">📮 收货信息</div>
  <input id="addressRaw" placeholder="粘贴地址+姓名+电话一键解析">
  <button class="parse-btn" onclick="parseAddress()">智能解析</button>
  <input id="name" placeholder="姓名">
  <input id="phone" placeholder="电话">
  <input id="address" placeholder="地址">
  <button class="submit-btn" onclick="submitOrder()">提交寄样订单</button>
</div>

<div class="card">
  <div style="font-weight:700">📋 历史订单</div>
  <div id="historyList"></div>
</div>

<div class="order-result" id="orderResult">
  <p>✅ 提交成功</p>
  <p>订单号：<span id="orderNo"></span></p>
</div>

<div class="card">
  <div style="font-weight:700">🔎 物流查询</div>
  <input id="queryOrderNo" placeholder="输入订单号">
  <button class="query-btn" onclick="queryOrder()">查询</button>
  <div id="queryResult"></div>
</div>

<script>
// ==================== 配置 ====================
const SUPABASE_URL = "https://mimlqogaaqhowxacdrew.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pbWxxb2dhYXFob3d4YWNkcmV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1Nzg5NjIsImV4cCI6MjA5MDE1NDk2Mn0.sEbmXYUQFMXOnIlhCfbF_esBKmaupx5a2h1eDwLX8Ac";

// 关键修复2：确保 supabase 全局可用
const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let cart = [];

// ==================== 商品 ====================
function loadGoodsFromDB() {
  document.getElementById("goodsList").innerHTML = "加载中...";
  supabase.from("goods").select("*").order("name").then(res => {
    if (res.data) renderGoodsList(res.data);
    else document.getElementById("goodsList").innerHTML = "暂无商品";
  });
}

function renderGoodsList(goods) {
  let html = "";
  goods.forEach(g => {
    html += `
    <div class="goods-item">
      <div>${g.name}</div>
      <button class="add-btn" onclick="addCart('${g.name}','${g.code}')">加购</button>
    </div>`;
  });
  document.getElementById("goodsList").innerHTML = html;
}

function addCart(name, code) {
  let item = cart.find(i => i.name === name);
  if (item) item.num++;
  else cart.push({ name, code, num: 1 });
  renderCart();
}

function renderCart() {
  let html = "";
  cart.forEach(i => {
    html += `<div>${i.name} ×${i.num}</div>`;
  });
  document.getElementById("cartList").innerHTML = html || "暂无商品";
}

// ==================== 地址 ====================
function parseAddress() {
  let raw = document.getElementById("addressRaw").value;
  let phone = raw.match(/1[3-9]\d{9}/)?.[0] || "";
  let name = raw.match(/[\u4e00-\u9fa5]{2,8}/)?.[0] || "";
  let addr = raw.replace(name, "").replace(phone, "");
  document.getElementById("name").value = name;
  document.getElementById("phone").value = phone;
  document.getElementById("address").value = addr;
}

// ==================== 订单 ====================
function submitOrder() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let addr = document.getElementById("address").value;
  if (!name || !phone || !addr || cart.length === 0) return alert("信息不全");

  let orderNo = "NMS" + Date.now();
  supabase.from("orders").insert([{
    orderNo, name, phone, address: addr,
    goods: cart, logistics: ""
  }]).then(res => {
    document.getElementById("orderResult").style.display = "block";
    document.getElementById("orderNo").innerText = orderNo;
    cart = [];
    renderCart();
  });
}

// ==================== 查询 ====================
function queryOrder() {
  let no = document.getElementById("queryOrderNo").value;
  supabase.from("orders").select("*").eq("orderNo", no).single().then(res => {
    if (res.data) {
      document.getElementById("queryResult").innerText =
        "物流：" + (res.data.logistics || "待发货");
    } else {
      document.getElementById("queryResult").innerText = "未找到订单";
    }
  });
}

// 初始化
window.onload = function() {
  loadGoodsFromDB();
  renderCart();
};
</script>
</body>
</html>
