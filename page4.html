<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>南漫社 · 商家管理后台</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, '微软雅黑', sans-serif;
  }
  body {
    background: #f0f2f6;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #d81e06;
    margin-bottom: 20px;
  }
  .admin-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 20px 24px;
    margin-bottom: 24px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
  }
  .card-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    border-left: 5px solid #d81e06;
    padding-left: 14px;
    color: #1e2a3a;
  }
  .btn {
    padding: 8px 18px;
    background: #07c160;
    color: white;
    border: none;
    border-radius: 40px;
    font-size: 14px;
    cursor: pointer;
    margin-right: 10px;
    margin-bottom: 8px;
  }
  .btn-red {
    background: #d81e06;
  }
  .btn-blue {
    background: #1677ff;
  }
  .btn-outline {
    background: #f4f5f7;
    color: #2c3e50;
    border: 1px solid #dcdfe6;
  }
  .flex-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  input, select {
    padding: 10px 14px;
    border: 1px solid #dcdfe6;
    border-radius: 40px;
    font-size: 14px;
    outline: none;
  }
  input:focus {
    border-color: #d81e06;
  }
  .order-list-container {
    max-height: 600px;
    overflow-y: auto;
  }
  .order-card {
    background: #fff;
    border: 1px solid #eceef2;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .order-header {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #e9ecef;
  }
  .order-no {
    font-weight: 800;
    color: #d81e06;
    background: #fff1ed;
    padding: 2px 12px;
    border-radius: 30px;
    font-size: 14px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 8px;
    margin: 12px 0;
    font-size: 14px;
  }
  .goods-detail {
    background: #f8f9fc;
    padding: 10px 12px;
    border-radius: 16px;
    margin: 8px 0;
  }
  .logistics-area {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .logistics-input {
    flex: 2;
    min-width: 180px;
    padding: 8px 14px;
    border-radius: 40px;
    border: 1px solid #ddd;
  }
  .badge-shipped {
    background: #e6f7e6;
    color: #2c6e2c;
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 12px;
  }
  .search-box {
    background: #f8f9fa;
    padding: 12px 16px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
  }
  .empty-orders {
    text-align: center;
    padding: 40px;
    color: #8c9aa9;
  }
  .batch-area {
    background: #fef6e0;
    padding: 16px;
    border-radius: 20px;
    margin-top: 12px;
  }
  .stats-badge {
    background: #fef0e6;
    border-radius: 30px;
    padding: 4px 12px;
    font-size: 13px;
  }
  .login-box {
    background: #fff;
    padding: 30px;
    border-radius: 20px;
    max-width: 400px;
    margin: 50px auto;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
<div id="login" class="login-box">
  <h2 style="color:#d81e06;">商家后台登录</h2>
  <input type="password" id="pwd" placeholder="请输入管理密码" style="margin-top:20px;width:100%;">
  <button onclick="login()" class="btn" style="width:100%;margin-top:16px;">登录后台</button>
  <div style="margin-top:10px;font-size:12px;color:#999;">数据保存14天，仅管理员可见</div>
</div>

<div id="admin" style="display:none;">
<h1>🏪 南漫社 · 商家管理后台</h1>
<div class="admin-card">
  <div class="card-title">📦 商品库管理</div>
  <div class="flex-row">
    <input type="file" id="fileInput" accept=".csv,.txt">
    <button class="btn" onclick="uploadGoods()">📤 上传并覆盖商品</button>
    <button class="btn btn-blue" onclick="exportSampleTemplate()">📎 下载商品模板</button>
    <button class="btn btn-outline" onclick="viewCurrentGoods()">👁️ 查看商品列表</button>
  </div>
  <div id="goodsPreview" style="font-size:13px; color:#2c6e2c;"></div>
</div>

<div class="admin-card">
  <div class="card-title">📋 订单管理中心（所有达人订单）</div>
  <div class="search-box">
    <div class="flex-row">
      <input type="text" id="searchOrderNo" class="search-input" placeholder="🔍 按订单号精确查询">
      <button class="btn btn-blue" onclick="searchByOrderNo()">查询订单</button>
      <button class="btn btn-outline" onclick="clearSearch()">清除筛选</button>
    </div>
  </div>
  <div class="flex-row">
    <input type="date" id="startDate">
    <input type="date" id="endDate">
    <button class="btn btn-blue" onclick="loadOrders()">🔍 筛选</button>
    <button class="btn btn-red" onclick="exportFilteredOrders()">📥 导出筛选结果</button>
    <span class="stats-badge" id="orderCountBadge">订单数: --</span>
  </div>
  <div class="batch-area">
    <div style="font-weight:600;margin-bottom:8px;">📦 批量上传物流单号</div>
    <div class="flex-row">
      <input type="file" id="logisticsFile" accept=".csv,.txt">
      <button class="btn btn-blue" onclick="batchUploadLogistics()">🚚 批量更新</button>
      <button class="btn btn-outline" onclick="downloadLogisticsTemplate()">📎 下载模板</button>
    </div>
    <div style="font-size:12px;color:#666;margin-top:6px;">格式：订单号,物流单号</div>
  </div>
  <div id="orderList" class="order-list-container"></div>
</div>
</div>

<script>
// 安全配置
const API = "https://api.aimonkey.cn/nms";
const TOKEN = "nanmansheadmin";
const ADMIN_PWD = "nms123";

let currentSearchNo = "";
let allOrders = [];

// 登录验证
function login() {
  const p = document.getElementById("pwd").value.trim();
  if (p === ADMIN_PWD) {
    document.getElementById("login").style.display = "none";
    document.getElementById("admin").style.display = "block";
    loadAllOrders();
  } else {
    alert("密码错误");
  }
}

// 加载所有订单（云端）
async function loadAllOrders() {
  try {
    const res = await fetch(`${API}/list`, { headers: { token: TOKEN } });
    const j = await res.json();
    if (j.code !== 0) { alert(j.msg || "加载失败"); return; }
    allOrders = (j.list || []).map(item => JSON.parse(atob(item.data)));
    renderOrderList(allOrders);
    document.getElementById("orderCountBadge").innerText = `📊 订单数: ${allOrders.length}`;
  } catch (e) {
    alert("网络异常，加载订单失败");
  }
}

// 渲染订单
function renderOrderList(orders) {
  const container = document.getElementById("orderList");
  if (!orders.length) {
    container.innerHTML = `<div class="empty-orders">📭 暂无订单</div>`;
    return;
  }
  container.innerHTML = orders.map(order => `
    <div class="order-card">
      <div class="order-header">
        <span class="order-no">🧾 ${order.orderNo}</span>
        <span>${order.createTime}</span>
      </div>
      <div class="info-grid">
        <div>👤 ${order.name}</div>
        <div>📞 ${order.phone}</div>
        <div>📍 ${order.address}</div>
      </div>
      <div class="goods-detail">
        ${order.goods.map(g => `<div>• ${g.name} ×${g.num}（${g.code}）</div>`).join('')}
      </div>
      <div class="logistics-area">
        <input type="text" class="logistics-input" value="${order.logistics||''}" placeholder="物流单号" id="log_${order.orderNo}">
        <button class="btn btn-blue" onclick="updateLogistics('${order.orderNo}')">保存</button>
        <button class="btn btn-red" onclick="deleteOrder('${order.orderNo}')">删除</button>
      </div>
    </div>
  `).join("");
}

// 更新物流
async function updateLogistics(orderNo) {
  const logi = document.getElementById(`log_${orderNo}`).value.trim();
  if (!logi) return alert("请输入物流单号");
  try {
    await fetch(`${API}/logistics`, {
      method: "POST",
      headers: { "Content-Type": "application/json", token: TOKEN },
      body: JSON.stringify({ orderNo, logistics: logi })
    });
    alert("物流已同步");
    loadAllOrders();
  } catch (e) {
    alert("同步失败");
  }
}

// 删除订单
async function deleteOrder(orderNo) {
  if (!confirm("确定删除该订单？")) return;
  try {
    await fetch(`${API}/delete?orderNo=${orderNo}`, { headers: { token: TOKEN } });
    loadAllOrders();
  } catch (e) {}
}

// 搜索订单
function searchByOrderNo() {
  const no = document.getElementById("searchOrderNo").value.trim();
  if (!no) return alert("请输入订单号");
  currentSearchNo = no;
  const list = allOrders.filter(o => o.orderNo === no);
  renderOrderList(list);
}

// 清除筛选
function clearSearch() {
  currentSearchNo = "";
  document.getElementById("searchOrderNo").value = "";
  renderOrderList(allOrders);
}

// 加载订单（带日期筛选）
function loadOrders() {
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;
  let list = [...allOrders];
  if (start) list = list.filter(o => o.createTime >= start);
  if (end) list = list.filter(o => o.createTime <= end + " 23:59:59");
  renderOrderList(list);
}

// 导出订单
function exportFilteredOrders() {
  let list = currentSearchNo ? allOrders.filter(o => o.orderNo === currentSearchNo) : allOrders;
  if (list.length === 0) return alert("无数据可导出");
  const csv = "\uFEFF订单号,下单时间,姓名,电话,地址,商品,数量,编码,物流\n" +
    list.map(o => o.goods.map(g => 
      `${o.orderNo},${o.createTime},${o.name},${o.phone},${o.address},${g.name},${g.num},${g.code},${o.logistics||""}`
    ).join("\n")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "南漫社订单.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

// 批量物流
async function batchUploadLogistics() {
  const file = document.getElementById("logisticsFile").files[0];
  if (!file) return alert("请选择文件");
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(i => i.trim());
    const map = {};
    lines.forEach(line => {
      const [no, log] = line.split(",");
      if (no && log) map[no.trim()] = log.trim();
    });
    fetch(`${API}/batch`, {
      method: "POST",
      headers: { "Content-Type": "application/json", token: TOKEN },
      body: JSON.stringify({ map })
    }).then(() => {
      alert("批量更新完成");
      loadAllOrders();
    });
  };
  reader.readAsText(file);
}

// 下载模板
function downloadLogisticsTemplate() {
  const csv = "NMS123456,SF1234567890\nNMS65432,YT7654321098";
  const blob = new Blob([csv], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "物流批量模板.txt";
  a.click();
}

// 商品功能（保留本地）
function uploadGoods() {}
function exportSampleTemplate() {}
function viewCurrentGoods() {}
</script>
</body>
</html>
