<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家后台 - 商品+订单管理</title>
<style>
body{font-family:微软雅黑;background:#f5f7fa;padding:20px;max-width:1000px;margin:0 auto;}
h1{text-align:center;color:#333;}
.btn{padding:10px 16px;background:#07c160;color:#fff;border:none;border-radius:8px;margin:5px;cursor:pointer;}
.btn-red{background:#d81e06;}
.btn-blue{background:#1677ff;}
.box{background:#fff;padding:15px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.order-card{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.code{color:#1677ff;font-weight:bold;}
input{padding:8px;border:1px solid #ddd;border-radius:6px;width:180px;}
.area-title{font-size:16px;font-weight:bold;margin-bottom:10px;}
.filter-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.filter-row input{width:160px;}
</style>
</head>
<body>
<h1>南漫社商家管理后台</h1>

<div class="box">
  <div class="area-title">📊 批量上传商品（A列编码，B列名称）</div>
  <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
  <button class="btn" onclick="uploadGoods()">上传并覆盖商品</button>
  <button class="btn btn-blue" onclick="exportSample()">下载商品模板</button>
</div>

<div class="box">
  <div class="area-title">📦 订单管理（精确到时分筛选）</div>
  
  <div class="filter-row">
    <input type="date" id="startDate" placeholder="开始日期">
    <input type="date" id="endDate" placeholder="结束日期">
    <button class="btn btn-blue" onclick="loadOrders()">🔍 筛选查询</button>
    <button class="btn btn-red" onclick="exportFilteredOrders()">📥 导出筛选结果</button>
  </div>

  <div id="orderList"></div>
</div>

<script>
// 上传商品（已修复乱码）
function uploadGoods() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("请选择文件");

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const decoder = new TextDecoder("gbk");
      text = decoder.decode(new Uint8Array(e.target.result));
    } catch (e) {
      text = new TextDecoder("utf-8").decode(new Uint8Array(e.target.result));
    }

    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const goods = [];
    lines.forEach(line => {
      const [code, name] = line.split(",");
      if (code && name) {
        goods.push({ code: code.trim(), name: name.trim() });
      }
    });
    localStorage.setItem("goodsData", JSON.stringify(goods));
    alert("上传成功！用户端已同步商品");
  };
  reader.readAsArrayBuffer(file);
}

// 下载商品模板
function exportSample() {
  const csv = "编码,商品名称\n6941899614135,红岁驰春 迷你吧唧1对";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = "商品上传模板.csv";
  a.click();
}

// ==============================
// ✅ 精确到 年月日 时分 筛选
// ==============================
function loadOrders() {
  let orders = JSON.parse(localStorage.getItem("nmsOrders") || "[]");
  orders = orders.filter(o => Date.now() - o.timestamp < 14*86400000);

  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  if (startDate) {
    const startTime = new Date(startDate).getTime();
    orders = orders.filter(o => o.timestamp >= startTime);
  }
  if (endDate) {
    const endTime = new Date(endDate + " 23:59:59").getTime();
    orders = orders.filter(o => o.timestamp <= endTime);
  }

  const list = document.getElementById("orderList");
  list.innerHTML = "";
  orders.forEach(o => {
    let div = document.createElement("div");
    div.className = "order-card";
    div.innerHTML = `
      <p><strong>订单号：${o.orderNo}</strong></p>
      <p>日期：${o.createTime}</p>
      <p>姓名：${o.name}　电话：${o.phone}</p>
      <p>地址：${o.address}</p>
      <p>商品：${o.goods.map(i=>i.name+" ×"+i.num).join("，")}</p>
      <p>编码：<span class="code">${o.goods.map(i=>i.code).join(" / ")}</span></p>
      <p>物流：${o.logistics || "未发货"}</p>
      <input type="text" id="log_${o.orderNo}" placeholder="输入物流单号">
      <button class="btn btn-blue" onclick="saveLog('${o.orderNo}')">保存发货</button>
    `;
    list.appendChild(div);
  });
}

// 保存物流
function saveLog(orderNo) {
  const log = document.getElementById(`log_${orderNo}`).value.trim();
  if (!log) return alert("请输入物流单号");
  let orders = JSON.parse(localStorage.getItem("nmsOrders") || "[]");
  const idx = orders.findIndex(x => x.orderNo === orderNo);
  if (idx !== -1) {
    orders[idx].logistics = log;
    localStorage.setItem("nmsOrders", JSON.stringify(orders));
    alert("发货成功");
    loadOrders();
  }
}

// ==============================
// ✅ 精确导出筛选结果
// ==============================
function exportFilteredOrders() {
  let orders = JSON.parse(localStorage.getItem("nmsOrders") || "[]");
  orders = orders.filter(o => Date.now() - o.timestamp < 14*86400000);

  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  if (startDate) {
    const startTime = new Date(startDate).getTime();
    orders = orders.filter(o => o.timestamp >= startTime);
  }
  if (endDate) {
    const endTime = new Date(endDate + " 23:59:59").getTime();
    orders = orders.filter(o => o.timestamp <= endTime);
  }

  if (orders.length === 0) {
    alert("当前筛选条件下没有订单可导出");
    return;
  }

  let csv = "订单号,下单日期,收件人,电话,地址,商品名称,数量,商品编码,物流单号\n";
  orders.forEach(o => {
    o.goods.forEach(g => {
      csv += `${o.orderNo},${o.createTime},${o.name},${o.phone},${o.address},"${g.name}",${g.num},${g.code},${o.logistics || ""}\n`;
    });
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = `南漫社订单_${startDate || "全部"}至${endDate || "全部"}.csv`;
  a.click();
}

window.onload = loadOrders;
</script>
</body>
</html>
