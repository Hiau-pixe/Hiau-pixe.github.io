<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>订单匹配系统（稳定增强版）</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#f5f6f8;padding:20px}
.box{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
button{padding:8px 12px;margin-right:10px}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border:1px solid #ddd;padding:6px}
th{background:#f2f2f2}
</style>
</head>

<body>

<div class="box">
    <h3>订单匹配系统（稳定版）</h3>
    <input type="file" id="file">
    <button onclick="run()">开始处理</button>
    <button onclick="exportExcel()">导出</button>
    <div id="msg"></div>
</div>

<div class="box">
    <div id="result"></div>
</div>

<script>

let resultData = [];

/* ========= 地址标准化 ========= */
function normalizeAddress(s){
    return String(s||"")
        .replace(/\s+/g,'')
        .replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'')
        .toLowerCase();
}

/* ========= 数量提取 ========= */
function getQty(text){
    let m = text.match(/(?:随机)?(\d+)\s*(个|件|盒|包|套)?/);
    return m ? parseInt(m[1]) : 1;
}

/* ========= 商品拆分 ========= */
function splitText(text){
    return String(text||"")
        .replace(/和/g,"、")
        .split(/[、，,;；+&]/g)
        .map(s=>s.trim())
        .filter(Boolean);
}

/* ========= 商品核心词提取（关键） ========= */
function coreName(name){

    return String(name)
        .replace(/\d+\/\d+/g,'')   // 去 1/8 1/11
        .replace(/\d+/g,'')       // 去数字
        .replace(/盲盒/g,'')
        .replace(/随机/g,'')
        .replace(/款/g,'')
        .replace(/系列/g,'')
        .replace(/\s+/g,'')
        .trim();
}

/* ========= 匹配函数（核心） ========= */
function matchProduct(text, products){

    text = String(text)
        .replace(/随机\d*个/g,'')
        .replace(/\d+个/g,'')
        .replace(/\d+件/g,'')
        .replace(/×\d+/g,'')
        .replace(/x\d+/ig,'')
        .replace(/\s+/g,'');

    let best = null;
    let bestLen = 0;

    for(let p of products){

        let core = coreName(p.name);

        if(!core) continue;

        if(text.includes(core)){

            if(core.length > bestLen){
                best = p;
                bestLen = core.length;
            }
        }
    }

    return best;
}

/* ========= 读取订单 ========= */
function parseOrders(sheet){

    let rows = XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});

    let h = rows[0];

    let a=0,p=1;

    h.forEach((v,i)=>{
        v=String(v);
        if(v.includes("地址")) a=i;
        if(v.includes("商品")||v.includes("产品")) p=i;
    });

    let list=[];

    for(let i=1;i<rows.length;i++){
        list.push({
            address:rows[i][a],
            product:rows[i][p]
        });
    }

    return list;
}

/* ========= 商品库 ========= */
function parseProducts(sheet){

    let rows = XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});

    let h = rows[0];

    let c=0,n=1;

    h.forEach((v,i)=>{
        v=String(v);
        if(v.includes("编码")) c=i;
        if(v.includes("名称")) n=i;
    });

    let list=[];

    for(let i=1;i<rows.length;i++){

        if(rows[i][c] && rows[i][n]){

            list.push({
                code:String(rows[i][c]),
                name:String(rows[i][n])
            });

        }
    }

    return list;
}

/* ========= 合并同SKU ========= */
function merge(list){

    let map={};

    list.forEach(r=>{

        let k=r.orderNo+"_"+r.code;

        if(!map[k]){
            map[k]=r;
        }else{
            map[k].qty += r.qty;
        }

    });

    return Object.values(map);
}

/* ========= 主流程 ========= */
function run(){

    let file=document.getElementById("file").files[0];
    if(!file) return alert("请选择文件");

    let reader=new FileReader();

    reader.onload=function(e){

        let wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});

        let orders=parseOrders(wb.Sheets[wb.SheetNames[0]]);
        let products=parseProducts(wb.Sheets[wb.SheetNames[1]]);

        let orderMap={};
        let seq=1;
        let out=[];

        for(let o of orders){

            let key=normalizeAddress(o.address);

            if(!orderMap[key]){
                orderMap[key]="ORD-"+String(seq++).padStart(4,'0');
            }

            let orderNo=orderMap[key];

            splitText(o.product).forEach(item=>{

                let qty=getQty(item);

                let clean=item.replace(/\d+/g,'');

                let p=matchProduct(clean,products);

                out.push({
                    orderNo,
                    address:o.address,
                    code:p?p.code:"未匹配",
                    name:p?p.name:"未识别",
                    qty
                });

            });

        }

        resultData=merge(out);

        render();

        document.getElementById("msg").innerText=
            "完成："+resultData.length+"条";
    };

    reader.readAsArrayBuffer(file);
}

/* ========= 渲染 ========= */
function render(){

    let html="<table><tr>
    <th>订单号</th><th>地址</th><th>SKU</th><th>商品</th><th>数量</th>
    </tr>";

    resultData.forEach(r=>{
        html+=`
        <tr>
        <td>${r.orderNo}</td>
        <td>${r.address}</td>
        <td>${r.code}</td>
        <td>${r.name}</td>
        <td>${r.qty}</td>
        </tr>`;
    });

    html+="</table>";

    document.getElementById("result").innerHTML=html;
}

/* ========= 导出 ========= */
function exportExcel(){

    if(!resultData.length) return alert("无数据");

    let arr=[["订单号","地址","SKU","商品","数量"]];

    resultData.forEach(r=>{
        arr.push([r.orderNo,r.address,r.code,r.name,r.qty]);
    });

    let ws=XLSX.utils.aoa_to_sheet(arr);
    let wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"订单");
    XLSX.writeFile(wb,"订单匹配结果.xlsx");
}

</script>

</body>
</html>
