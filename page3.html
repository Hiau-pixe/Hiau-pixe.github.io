<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订单匹配器</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
    font-family:Arial;
    background:#f5f6f8;
    padding:20px;
}
.box{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}
button{
    padding:8px 15px;
    margin-right:10px;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border:1px solid #ddd;
    padding:6px;
    font-size:12px;
}
th{
    background:#f2f2f2;
}
</style>

</head>

<body>

<div class="box">
    <h2>订单匹配器</h2>

```
<input type="file" id="fileInput" accept=".xlsx,.xls">

<button id="btnRun">开始处理</button>

<button id="btnExport">导出结果</button>

<div id="msg"></div>
```

</div>

<div class="box">
    <div id="result"></div>
</div>

<script>

var resultData = [];

document.getElementById("btnRun").addEventListener("click", run);
document.getElementById("btnExport").addEventListener("click", exportExcel);

function normalizeAddress(str){

    if(!str) return "";

    return String(str)
        .replace(/\s+/g,"")
        .replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,"")
        .toLowerCase();
}

function extractQuantity(text){

    var m = text.match(/(?:随机)?(\d+)\s*(个|件|盒|包|套)/);

    if(m){
        return parseInt(m[1],10);
    }

    return 1;
}

function splitProducts(text){

    if(!text) return [];

    text = String(text);

    text = text.replace(/和/g,"|");

    return text
        .split(/[、，,；;+&|]/)
        .map(function(x){
            return x.trim();
        })
        .filter(function(x){
            return x !== "";
        });
}

function parseOrders(sheet){

    var rows = XLSX.utils.sheet_to_json(sheet,{
        header:1,
        defval:""
    });

    var headers = rows[0];

    var addressIndex = 0;
    var productIndex = 1;

    headers.forEach(function(h,i){

        h = String(h);

        if(h.indexOf("地址") !== -1){
            addressIndex = i;
        }

        if(
            h.indexOf("商品") !== -1 ||
            h.indexOf("产品") !== -1
        ){
            productIndex = i;
        }

    });

    var orders = [];

    for(var i=1;i<rows.length;i++){

        orders.push({
            address: rows[i][addressIndex],
            product: rows[i][productIndex]
        });
    }

    return orders;
}

function parseProducts(sheet){

    var rows = XLSX.utils.sheet_to_json(sheet,{
        header:1,
        defval:""
    });

    var headers = rows[0];

    var codeIndex = 0;
    var nameIndex = 1;

    headers.forEach(function(h,i){

        h = String(h);

        if(h.indexOf("编码") !== -1){
            codeIndex = i;
        }

        if(h.indexOf("名称") !== -1){
            nameIndex = i;
        }

    });

    var products = [];

    for(var i=1;i<rows.length;i++){

        if(rows[i][codeIndex] && rows[i][nameIndex]){

            products.push({
                code:String(rows[i][codeIndex]),
                name:String(rows[i][nameIndex])
            });

        }
    }

    return products;
}

function matchProduct(text, products){

    text = String(text).toLowerCase();

    var best = null;
    var bestLen = 0;

    products.forEach(function(p){

        var name = p.name.toLowerCase();

        if(text.indexOf(name) !== -1){

            if(name.length > bestLen){

                best = p;
                bestLen = name.length;
            }
        }

    });

    return best;
}

function mergeRows(rows){

    var map = {};

    rows.forEach(function(r){

        var key = r.orderNo + "_" + r.sku;

        if(!map[key]){

            map[key] = {
                orderNo:r.orderNo,
                address:r.address,
                sku:r.sku,
                name:r.name,
                qty:r.qty
            };

        }else{

            map[key].qty += r.qty;

        }

    });

    return Object.values(map);
}

function run(){

    var file =
        document.getElementById("fileInput").files[0];

    if(!file){

        alert("请选择Excel文件");

        return;
    }

    var reader = new FileReader();

    reader.onload = function(e){

        try{

            var wb = XLSX.read(
                new Uint8Array(e.target.result),
                {type:"array"}
            );

            if(wb.SheetNames.length < 2){

                alert("需要两个工作表");

                return;
            }

            var orders =
                parseOrders(
                    wb.Sheets[wb.SheetNames[0]]
                );

            var products =
                parseProducts(
                    wb.Sheets[wb.SheetNames[1]]
                );

            var orderMap = {};

            var seq = 1;

            var rows = [];

            orders.forEach(function(order){

                var key =
                    normalizeAddress(order.address);

                if(!orderMap[key]){

                    orderMap[key] =
                        "ORD-" +
                        String(seq).padStart(4,"0");

                    seq++;
                }

                var orderNo = orderMap[key];

                var list =
                    splitProducts(order.product);

                list.forEach(function(item){

                    var qty =
                        extractQuantity(item);

                    var clean =
                        item.replace(/\d+/g,"");

                    var p =
                        matchProduct(
                            clean,
                            products
                        );

                    rows.push({

                        orderNo:orderNo,

                        address:order.address,

                        sku:p ? p.code : "未匹配",

                        name:p ? p.name : "未识别",

                        qty:qty

                    });

                });

            });

            resultData = mergeRows(rows);

            renderTable();

            document.getElementById("msg").innerHTML =
                "处理完成，共 " +
                resultData.length +
                " 条记录";

        }
        catch(err){

            console.error(err);

            alert(err.message);

        }

    };

    reader.readAsArrayBuffer(file);
}

function renderTable(){

    var html = "";

    html += "<table>";

    html += "<tr>";
    html += "<th>订单号</th>";
    html += "<th>地址</th>";
    html += "<th>SKU</th>";
    html += "<th>商品名称</th>";
    html += "<th>数量</th>";
    html += "</tr>";

    resultData.forEach(function(r){

        html += "<tr>";

        html += "<td>"+r.orderNo+"</td>";
        html += "<td>"+r.address+"</td>";
        html += "<td>"+r.sku+"</td>";
        html += "<td>"+r.name+"</td>";
        html += "<td>"+r.qty+"</td>";

        html += "</tr>";

    });

    html += "</table>";

    document.getElementById("result").innerHTML =
        html;
}

function exportExcel(){

    if(resultData.length===0){

        alert("没有数据");

        return;
    }

    var arr = [];

    arr.push([
        "订单号",
        "地址",
        "SKU",
        "商品名称",
        "数量"
    ]);

    resultData.forEach(function(r){

        arr.push([
            r.orderNo,
            r.address,
            r.sku,
            r.name,
            r.qty
        ]);

    });

    var ws =
        XLSX.utils.aoa_to_sheet(arr);

    var wb =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        "结果"
    );

    XLSX.writeFile(
        wb,
        "订单匹配结果.xlsx"
    );
}

</script>

</body>
</html>
